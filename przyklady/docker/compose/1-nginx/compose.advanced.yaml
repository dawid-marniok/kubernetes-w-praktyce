# Ten sam nginx, ale z większością typowych pól compose — do omówienia.
# Start: docker compose -f compose.advanced.yaml up -d   ->   http://localhost:8889

name: nginx-advanced            # nazwa projektu (zamiast nazwy katalogu)

services:
  nginx:
    image: nginx:1.29
    container_name: nginx-advanced   # stała nazwa kontenera (uwaga: blokuje --scale)
    ports:
      - "8889:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro   # bind mount (katalog z hosta)
      - nginx_logs:/var/log/nginx         # nazwany wolumen: logi idą do plików w wolumenie, nie do docker logs
    environment:
      NGINX_HOST: localhost
      NGINX_PORT: "80"
    networks:
      - frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

networks:
  frontend:
    driver: bridge

volumes:
  nginx_logs:
