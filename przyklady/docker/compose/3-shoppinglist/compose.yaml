# Lista zakupów: web (Flask, port hosta 5001) -> db (PostgreSQL 18)
# Start:              docker compose up -d --build
# Z panelem pgAdmin:  docker compose --profile debug up -d
# Hasła to atrapy — tylko do zajęć.

services:
  web:
    build: ./app
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: postgresql://shop:changeme-postgres@db:5432/shoppingdb
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: changeme-postgres
      POSTGRES_DB: shoppingdb
    volumes:
      # postgres 18+: wolumen na /var/lib/postgresql (dane w podkatalogu 18/docker)
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shoppingdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Panel WWW do bazy — tylko z --profile debug
  pgadmin:
    image: dpage/pgadmin4:9.18
    profiles: ["debug"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: changeme-pgadmin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
