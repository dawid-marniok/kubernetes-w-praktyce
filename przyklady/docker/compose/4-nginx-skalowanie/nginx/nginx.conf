events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Wbudowany DNS Dockera. valid=5s: nginx co 5 s pyta o aktualną listę replik "web".
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream web_servers {
        # zone + resolve (nginx >= 1.27.3): nazwa "web" jest rozwiązywana na bieżąco,
        # więc po `--scale web=N` nowe repliki wchodzą do puli bez restartu nginx.
        # Bez "resolve" nginx rozwiązałby nazwę raz, przy starcie.
        zone web_servers 64k;
        server web:5000 resolve;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://web_servers;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;

            # Podgląd: adres repliki, do której nginx przekazał żądanie
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
