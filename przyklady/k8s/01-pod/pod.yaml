# Najprostszy pod: jeden kontener, etykieta, port, zasoby.
apiVersion: v1
kind: Pod
metadata:
  name: przyklad-pod
  labels:
    app: przyklad-pod
spec:
  containers:
  - name: nginx
    image: nginx:1.29
    ports:
    - containerPort: 80          # informacyjnie: kontener i tak słucha, na czym chce
    resources:
      requests:                  # rezerwacja: scheduler szuka węzła z tyloma wolnymi zasobami
        cpu: 50m                 # 1000m = 1 rdzeń
        memory: 32Mi             # Mi/Gi = potęgi 1024
      limits:                    # sufit: CPU ponad limit = dławienie, pamięć ponad limit = OOMKilled
        cpu: 100m
        memory: 64Mi
