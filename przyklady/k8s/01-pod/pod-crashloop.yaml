# Awaria 2: proces kończy się kodem 1 → Error, potem CrashLoopBackOff (restarty coraz rzadziej, do 5 min).
# Diagnoza: kubectl logs przyklad-crashloop --previous (log poprzedniego uruchomienia) i Last State w describe.
apiVersion: v1
kind: Pod
metadata:
  name: przyklad-crashloop
  labels:
    app: przyklad-crashloop
spec:
  containers:
  - name: app
    image: busybox:1.37
    command:
      - sh
      - -c
      - "echo 'Brak zmiennej DB_HOST, koncze prace'; exit 1"
    resources:
      requests:
        cpu: 50m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 32Mi
