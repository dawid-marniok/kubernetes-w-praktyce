# Trzy sondy: startup (wolny start), readiness (czy przyjąć ruch), liveness (czy restartować).
# liveness sprawdza tylko sam proces — zależności (baza) to sprawa readiness.
apiVersion: v1
kind: Pod
metadata:
  name: przyklad-sondy
  labels:
    app: przyklad-sondy
spec:
  containers:
  - name: nginx
    image: nginx:1.29
    ports:
    - name: http
      containerPort: 80
    startupProbe:              # dopóki nie przejdzie, readiness i liveness czekają; porażka po limicie = restart
      httpGet:                 # inne typy: tcpSocket, exec (komenda, kod 0 = OK), grpc
        path: /
        port: http
      failureThreshold: 30     # ile porażek z rzędu, zanim sonda uzna błąd (tu: 30 × 2 s = 60 s na start)
      periodSeconds: 2         # co ile sekund sprawdzać (domyślnie 10)
    readinessProbe:            # porażka = pod wypada z Service (EndpointSlice), bez restartu
      httpGet:
        path: /
        port: http
      periodSeconds: 5
    livenessProbe:             # porażka = kubelet restartuje kontener
      httpGet:
        path: /
        port: http
      periodSeconds: 10
      timeoutSeconds: 2        # ile czekać na odpowiedź (domyślnie 1 s)
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
