# command nadpisuje ENTRYPOINT obrazu, args nadpisuje CMD. Opis: DOCKER-vs-KUBERNETES-command-args.md
# - tylko args: ENTRYPOINT z obrazu + Twoje argumenty
# - tylko command: Twoja komenda, CMD z obrazu jest ignorowany
# - oba: obraz nie ma nic do powiedzenia
apiVersion: v1
kind: Pod
metadata:
  name: przyklad-command-args
  labels:
    app: przyklad-command-args
spec:
  containers:
  - name: busybox
    image: busybox:1.37
    command: ["sh", "-c"]
    args: ["echo 'Hello z Kubernetesa' && sleep 3600"]
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 50m, memory: 32Mi}
