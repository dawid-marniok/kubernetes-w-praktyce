# ConstraintTemplate: wymagane etykiety (Rego, z parametrem "labels").
# Pełna wersja z wyrażeniami regularnymi i CEL: k8srequiredlabels w gatekeeper-library.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredlabels
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredLabels
      validation:
        openAPIV3Schema:
          type: object
          properties:
            labels:
              type: array
              items: {type: string}
  targets:
  - target: admission.k8s.gatekeeper.sh
    rego: |
      package k8srequiredlabels

      violation[{"msg": msg, "details": {"brakuje": brakuje}}] {
        sa := {l | input.review.object.metadata.labels[l]}
        wymagane := {l | l := input.parameters.labels[_]}
        brakuje := wymagane - sa
        count(brakuje) > 0
        msg := sprintf("%v <%v>: brak wymaganych etykiet %v", [input.review.object.kind, input.review.object.metadata.name, brakuje])
      }
