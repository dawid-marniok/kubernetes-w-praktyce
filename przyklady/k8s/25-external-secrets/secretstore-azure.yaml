# Tylko do pokazania (nie wgrywamy): ten sam ExternalSecret działa z Azure Key Vault.
# Zmienia się wyłącznie magazyn. Uwierzytelnienie: Workload Identity na AKS (ServiceAccount z adnotacją
# azure.workload.identity/client-id i federacją w Entra ID), bez haseł w YAML-u.
apiVersion: external-secrets.io/v1
kind: SecretStore                   # w namespace zespołu: każdy zespół ma własną tożsamość i własny sejf
metadata:
  name: azure-kv
spec:
  provider:
    azurekv:
      vaultUrl: https://<nazwa-sejfu>.vault.azure.net
      authType: WorkloadIdentity
      serviceAccountRef:
        name: eso-keyvault          # SA z adnotacją azure.workload.identity/client-id: <id tożsamości>
# W ExternalSecret: secretStoreRef: {kind: SecretStore, name: azure-kv}, remoteRef.key = nazwa sekretu w Key Vault
