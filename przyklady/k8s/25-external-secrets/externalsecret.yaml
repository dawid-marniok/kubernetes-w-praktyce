# Sejf → zwykły Secret. ESO co refreshInterval czyta szkolenie/demo/todos z AWS Secrets Manager
# i zapisuje Secret todos-sejf w tym namespace. Aplikacja widzi tylko Secret, o sejfie nic nie wie.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: todos-sejf
spec:
  refreshInterval: 30s              # na produkcji raczej 1h: każde odświeżenie to płatne zapytanie do API
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: todos-sejf                # Secret, który powstanie
    creationPolicy: Owner           # usuniesz ExternalSecret → zniknie też Secret
  data:
    - secretKey: MONGODB_URI        # klucz w Secret
      remoteRef:
        key: szkolenie/demo/todos   # nazwa sekretu w Secrets Manager
        property: MONGODB_URI       # pole w JSON-ie
    - secretKey: API_KEY
      remoteRef:
        key: szkolenie/demo/todos
        property: API_KEY
