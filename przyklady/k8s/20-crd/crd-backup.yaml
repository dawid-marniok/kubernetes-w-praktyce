# CRD: nowy typ Backup w API.
# Nazwa CRD = <plural>.<group>. Schemat jest obowiązkowy w apiextensions.k8s.io/v1.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backups.szkolenie.example.com
spec:
  group: szkolenie.example.com
  scope: Namespaced              # Namespaced: obiekty w namespace; Cluster: obiekty klastrowe
  names:
    kind: Backup
    singular: backup
    plural: backups
    shortNames: [bk]
  versions:
  - name: v1
    served: true                 # wersja dostępna w API
    storage: true                # w tej wersji obiekty są zapisywane w etcd (dokładnie jedna wersja)
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [schedule]
            properties:
              schedule:
                type: string
                description: Harmonogram w formacie cron, np. "0 2 * * *"
              retention:
                type: integer
                minimum: 1
                description: Ile kopii trzymać
    additionalPrinterColumns:    # dodatkowe kolumny w kubectl get
    - name: Schedule
      type: string
      jsonPath: .spec.schedule
    - name: Retention
      type: integer
      jsonPath: .spec.retention
