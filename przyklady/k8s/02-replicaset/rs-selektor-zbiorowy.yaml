# Selektor z kilkoma etykietami i wyrażeniem: pod musi spełnić wszystkie warunki.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: przyklad-rs-env
  labels:
    app: przyklad-rs-env
spec:
  replicas: 2
  selector:
    matchLabels:
      app: przyklad-rs-env
    matchExpressions:            # warunki łączone przez AND z matchLabels
    - key: environment
      operator: In               # In, NotIn, Exists, DoesNotExist
      values:
        - dev
        - test
  template:
    metadata:
      labels:
        app: przyklad-rs-env
        environment: dev
    spec:
      containers:
      - name: alpine
        image: alpine:3.22
        command:
          - sh
          - -c
          - "sleep 3600"
        env:
        - name: ENVIRONMENT
          value: dev
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
