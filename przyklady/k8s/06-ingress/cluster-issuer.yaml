# cert-manager: ClusterIssuer dla Let's Encrypt (staging — certyfikaty testowe, bez limitów produkcji).
# Wymaga zainstalowanego cert-managera (obiekt klastrowy — tworzy administrator) i prawdziwej domeny wskazującej na kontroler.
# Podmień <e-mail>. Produkcja: server https://acme-v02.api.letsencrypt.org/directory
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: <e-mail>
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
    - http01:
        ingress:
          ingressClassName: traefik     # kubectl get ingressclass
