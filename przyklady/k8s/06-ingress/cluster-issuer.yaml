# cert-manager: ClusterIssuer dla Let's Encrypt (produkcja — certyfikaty zaufane przez przeglądarki; tego używamy na szkoleniu).
# Wymaga zainstalowanego cert-managera (obiekt klastrowy — tworzy administrator) i prawdziwej domeny wskazującej na kontroler.
# Podmień <e-mail>. Do testów bez limitów produkcji: staging, server https://acme-staging-v02.api.letsencrypt.org/directory
# (certyfikat testowy — przeglądarka go ostrzeże).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: <e-mail>
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          ingressClassName: traefik     # kubectl get ingressclass
