# Deployment z sondami i zasobami. Rollout czeka na readiness nowych podów, zanim usunie stare.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: przyklad-sondy
  labels:
    app: przyklad-sondy
spec:
  replicas: 4
  selector:
    matchLabels:
      app: przyklad-sondy
  template:
    metadata:
      labels:
        app: przyklad-sondy
    spec:
      containers:
      - name: nginx
        image: nginx:1.29
        ports:
        - name: http
          containerPort: 80
        startupProbe:
          httpGet:
            path: /
            port: http
          failureThreshold: 30     # 30 prób × 2 s = do 60 s na start
          periodSeconds: 2
        readinessProbe:            # rollout czeka, aż nowy pod ją przejdzie, zanim usunie stary
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        livenessProbe:             # porażka = restart kontenera
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 2        # czas na odpowiedź (domyślnie 1 s)
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
