# Izolacja namespace: do podów wolno wejść tylko z podów z TEGO SAMEGO namespace.
# Ruch wychodzący bez zmian (brak Egress w policyTypes).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-namespace
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
