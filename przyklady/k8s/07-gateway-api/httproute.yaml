# HTTPRoute pisze zespół aplikacji: host + ścieżka → Service. Do Traefika nie odwołuje się wprost —
# wskazuje Gateway (parentRefs), a Gateway przez gatewayClassName wskazuje kontroler.
# Host taki sam jak w listenerze gateway.yaml. Gateway w innym namespace: dopisz namespace w parentRefs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: przyklad-route
spec:
  parentRefs:
  - name: przyklad-gw            # ./gateway.yaml — podpina się pod oba listenery (http i https)
  hostnames:                     # musi pasować do hostname listenera; bez pola = host z listenera
  - gw-trener.k8s.marniok.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: przyklad-deploy       # ../05-service/clusterip.yaml
      port: 80
