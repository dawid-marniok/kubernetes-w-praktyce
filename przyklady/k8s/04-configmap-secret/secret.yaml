# Secret z atrapą hasła. stringData = jawny tekst w pliku, klaster zapisze go jako base64 w data.
# Prawdziwych haseł NIE trzymamy w repo — tworzymy je komendą (README) albo przez Sealed Secrets / SOPS / AWS Secrets Manager (External Secrets Operator).
apiVersion: v1
kind: Secret
metadata:
  name: przyklad-db
type: Opaque              # dowolne klucze; inne typy: kubernetes.io/tls, kubernetes.io/dockerconfigjson (README)
stringData:               # jawny tekst; data: wartości już w base64
  password: changeme-przyklad
