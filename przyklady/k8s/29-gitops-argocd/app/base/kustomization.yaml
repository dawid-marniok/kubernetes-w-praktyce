apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
# ConfigMap z generatora: nazwa dostaje hash treści (podinfo-config-<hash>), a Kustomize
# poprawia odwołanie w Deploymencie. Zmiana napisu = nowa nazwa = nowe pody (rollout).
configMapGenerator:
  - name: podinfo-config
    literals:
      - PODINFO_UI_MESSAGE=baza
      - PODINFO_UI_COLOR=#6b7280
