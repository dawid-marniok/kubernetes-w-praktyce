# Prod: 2 repliki, sprawdzona wersja podinfo, granatowy. Podgląd: kubectl kustomize app/overlays/prod
# Tę nakładkę wdraża Argo CD (application.yaml). Zmiana tutaj + git push = zmiana w klastrze.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
nameSuffix: -prod
labels:
  - pairs: {env: prod}
    includeSelectors: true   # selektor Service i Deploymentu też dostaje env, więc dev i prod się nie mieszają
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: "6.14.1"
replicas:
  - name: podinfo            # nazwa z bazy, przed dopisaniem -prod
    count: 2
configMapGenerator:
  - name: podinfo-config
    behavior: merge
    literals:
      - PODINFO_UI_MESSAGE=prod v1
      - PODINFO_UI_COLOR=#1e3a5f
