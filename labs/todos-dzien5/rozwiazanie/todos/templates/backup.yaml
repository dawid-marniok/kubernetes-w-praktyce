{{- if .Values.backup.enabled }}
# (*) Backup z dnia 3/4. PVC z archiwami ma resource-policy keep: helm uninstall zostawia go w klastrze.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todos-backup
  labels:
    {{- include "todos.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongo-backup
  labels:
    {{- include "todos.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: todos
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: todos-backup
            app.kubernetes.io/part-of: todos
        spec:
          restartPolicy: Never
          serviceAccountName: mongo-backup
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: {{ .Values.mongo.image }}
              env:
                - name: MONGODB_URI
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.existingSecret }}
                      key: uri
              command:
                - sh
                - -c
                - |
                  set -e
                  plik=/backup/todos-$(date +%Y%m%d-%H%M).archive.gz
                  mongodump --uri="$MONGODB_URI" --archive="$plik" --gzip
                  ls -t /backup/todos-*.archive.gz | tail -n +8 | xargs -r rm -f --
                  ls -lh /backup
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                {{- include "todos.containerSecurity" . | nindent 16 }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: todos-backup
{{- end }}
