# API (Node.js) z dnia 4. Selektor app: todos-api bez zmian: selektora Deploymentu nie da się zmienić,
# a przejmowany Deployment ma właśnie taki.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: todos-api
    {{- include "todos.labels" . | nindent 4 }}
spec:
  # replicas: celowo brak, liczbą podów rządzi HPA
  selector:
    matchLabels:
      app: todos-api
  template:
    metadata:
      labels:
        app: todos-api
        {{- include "todos.labels" . | nindent 8 }}
      {{- if .Values.otel.enabled }}
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: {{ .Values.otel.instrumentation | quote }}
      {{- end }}
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000                # USER node z obrazu, liczbowo
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ include "todos.image" (dict "ctx" . "img" .Values.api.image) }}
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: uri
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.otel.enabled }}
            - name: OTEL_SERVICE_NAME
              value: todos-api-{{ .Release.Namespace }}   # bez tego trace'y całej grupy zlałyby się w jeden serwis
            {{- end }}
          envFrom:
            - configMapRef:
                name: todos-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            requests:
              {{- toYaml .Values.api.resources.requests | nindent 14 }}
            limits:
              cpu: {{ .Values.api.resources.limits.cpu }}
              memory: {{ ternary .Values.otel.memoryLimit .Values.api.resources.limits.memory .Values.otel.enabled }}
          securityContext:
            {{- include "todos.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api                      # nginx w obrazie web szuka backendu pod tą nazwą (API_HOST)
  labels:
    {{- include "todos.labels" . | nindent 4 }}
spec:
  selector:
    app: todos-api
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  labels:
    {{- include "todos.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.hpa.cpu }}
