# MongoDB z dnia 4. W StatefulSecie nie da się zmienić selector, serviceName ani volumeClaimTemplates:
# muszą być identyczne jak w przejmowanym obiekcie, inaczej upgrade kończy się „Forbidden: updates to statefulset spec…”.
# PVC data-mongo-0 tworzy StatefulSet, nie Helm: helm uninstall go nie usunie, zadania zostają.
apiVersion: v1
kind: Service
metadata:
  name: mongo                    # ta nazwa jest w adresie bazy (Secret todos-mongo, klucz uri)
  labels:
    {{- include "todos.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: todos-mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels:
    app: todos-mongo
    {{- include "todos.labels" . | nindent 4 }}
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: todos-mongo
  template:
    metadata:
      labels:
        app: todos-mongo
        {{- include "todos.labels" . | nindent 8 }}
    spec:
      serviceAccountName: mongo
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongo
          image: {{ .Values.mongo.image }}
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: password
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.mongo.resources | nindent 12 }}
          securityContext:
            {{- include "todos.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: tmp
              mountPath: /tmp
            - name: configdb
              mountPath: /data/configdb
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: configdb
          emptyDir:
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: todos   # dokładnie jak w dniu 4: to pole jest niezmienne
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.mongo.storage }}
