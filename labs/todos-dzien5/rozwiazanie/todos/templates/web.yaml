# Frontend (nginx + React) z dnia 4 i Ingress z dnia 2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: todos-web
    {{- include "todos.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: todos-web
  template:
    metadata:
      labels:
        app: todos-web
        {{- include "todos.labels" . | nindent 8 }}
    spec:
      serviceAccountName: web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101                 # nginx z obrazu nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "todos.image" (dict "ctx" . "img" .Values.web.image) }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: todos-config
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "todos.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: conf
              mountPath: /etc/nginx/conf.d   # entrypoint generuje tu konfigurację z szablonu
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: conf
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "todos.labels" . | nindent 4 }}
spec:
  selector:
    app: todos-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todos
  labels:
    {{- include "todos.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer }}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ required "Ustaw host: --set host=todos-<login>.<DOMENA>" .Values.host }}
      secretName: todos-tls
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
