# Dla porównania: PostgreSQL „po staremu” — Deployment + PVC + Secret + Service.
# Jedna instancja, bez replikacji, bez failoveru, bez backupu. Tylko do przeczytania (nie musisz wdrażać).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: changeme-lab18
  POSTGRES_DB: app
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: {app: postgres}
spec:
  replicas: 1                   # więcej się nie da: jeden PVC RWO, brak replikacji
  strategy: {type: Recreate}    # stary pod musi oddać dysk, zanim wstanie nowy
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17
          envFrom:
            - secretRef: {name: postgres-secret}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
# Brakuje: replik, automatycznego failoveru, backupu i PITR, kontrolowanego upgrade'u wersji.
# Porównaj z cluster.yaml: kilkanaście linii i operator robi resztę.
