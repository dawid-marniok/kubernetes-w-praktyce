# ToDos · dzień 2: API (Node.js).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: todos-api, app.kubernetes.io/part-of: todos}
spec:
  replicas: 2
  selector:
    matchLabels: {app: todos-api}
  template:
    metadata:
      labels: {app: todos-api, app.kubernetes.io/part-of: todos}
    spec:
      containers:
        - name: api
          image: <REJESTR>/todos-api:1.0.0
          ports:
            - {name: http, containerPort: 3001}
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef: {name: todos-mongo, key: uri}
          envFrom:
            - configMapRef: {name: todos-config}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api                      # nginx w obrazie web szuka backendu pod tą nazwą (API_HOST)
  labels: {app.kubernetes.io/part-of: todos}
spec:
  selector: {app: todos-api}
  ports:
    - {name: http, port: 3001, targetPort: http}
