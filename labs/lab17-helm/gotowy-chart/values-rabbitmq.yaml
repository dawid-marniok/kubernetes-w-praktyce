# RabbitMQ z chartu CloudPirates (oci://registry-1.docker.io/cloudpirates/rabbitmq, wersja 0.21.32, RabbitMQ 4.4.0).
# Nadpisujesz tylko to, co inne niż w `helm show values`. Obraz zostaje z chartu (Docker Hub, wersja przypięta digestem).
image:
  imagePullPolicy: IfNotPresent     # domyślnie Always: każdy start poda pyta Docker Hub o obraz (limit pobrań);
                                   # obraz jest przypięty digestem, więc kopia na węźle wystarczy
initContainer:
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 50m, memory: 32Mi}
auth:
  username: admin
  password: "szkolenie-rabbit"       # tylko na labie; na produkcji auth.existingSecret
persistence:
  size: 1Gi                          # domyślnie 8Gi; StorageClass domyślna (gp3)
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
