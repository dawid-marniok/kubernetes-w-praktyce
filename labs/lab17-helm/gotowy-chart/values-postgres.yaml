# PostgreSQL z chartu CloudPirates (oci://registry-1.docker.io/cloudpirates/postgres, wersja 0.21.2, PostgreSQL 18.6).
# Nadpisujesz tylko to, co inne niż w `helm show values`. Obraz zostaje z chartu (Docker Hub, wersja przypięta digestem).
image:
  imagePullPolicy: IfNotPresent     # domyślnie Always: każdy start poda pyta Docker Hub o obraz (limit pobrań);
                                   # obraz jest przypięty digestem, więc kopia na węźle wystarczy
auth:
  password: "szkolenie-pg"           # hasło użytkownika postgres; na produkcji auth.existingSecret
config:
  postgresql:
    effective_cache_size: 256MB      # domyślnie 4GB, a pod ma limit 512Mi
podSecurityContext:
  fsGroup: 999
  seccompProfile: {type: RuntimeDefault}   # wymaganie PSA restricted; chart domyślnie go nie ustawia
persistence:
  size: 1Gi                          # domyślnie 8Gi; StorageClass domyślna (gp3)
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
