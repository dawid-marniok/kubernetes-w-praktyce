# Lab07, krok 3: Apache czyta httpd.conf z ConfigMapy lab07-httpd-conf (utwórz ją najpierw z pliku httpd.conf).
# subPath podmienia jeden plik w katalogu conf/ — reszta plików z obrazu zostaje.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab07-apache
  labels:
    app: lab07-apache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab07-apache
  template:
    metadata:
      labels:
        app: lab07-apache
    spec:
      containers:
      - name: apache
        image: httpd:2.4
        ports:
        - name: http
          containerPort: 80
        volumeMounts:
        - name: config
          mountPath: /usr/local/apache2/conf/httpd.conf
          subPath: httpd.conf
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: lab07-httpd-conf     # nazwa ConfigMapy
