# ToDos · dzień 4: frontend (nginx + zbudowany React). Nginx słucha na 8080 i przekazuje /api/ do http://$API_HOST:$API_PORT.
# Zmiany od wczoraj: własny ServiceAccount bez tokenu, securityContext pod PSA restricted, system plików tylko do odczytu
# i dwa emptyDir: /tmp (pid i pliki tymczasowe nginx) oraz /etc/nginx/conf.d (entrypoint generuje tam konfigurację z szablonu).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: todos-web
    app.kubernetes.io/part-of: todos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todos-web
  template:
    metadata:
      labels:
        app: todos-web
        app.kubernetes.io/part-of: todos
    spec:
      serviceAccountName: web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101                 # nginx z obrazu nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: <REJESTR>/todos-web:1.0.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: todos-config
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: conf
              mountPath: /etc/nginx/conf.d   # bez tego: „can't create /etc/nginx/conf.d/default.conf: Read-only file system”
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: conf
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/part-of: todos
spec:
  selector:
    app: todos-web
  ports:
    - name: http
      port: 80
      targetPort: http
