# ToDos · dzień 4: osobny ServiceAccount dla każdego składnika, bez tokenu w podzie.
# ToDos nie rozmawia z API Kubernetesa, więc nie ma tu Role ani RoleBindingu: konto bez ról nie może nic,
# a automountServiceAccountToken: false sprawia, że w kontenerze nie ma nawet czym się do API uwierzytelnić.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  labels:
    app.kubernetes.io/part-of: todos
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  labels:
    app.kubernetes.io/part-of: todos
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongo
  labels:
    app.kubernetes.io/part-of: todos
automountServiceAccountToken: false
---
# (*) dla CronJobu mongo-backup z dnia 3. Bez backupu ten obiekt nikomu nie przeszkadza.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongo-backup
  labels:
    app.kubernetes.io/part-of: todos
automountServiceAccountToken: false
