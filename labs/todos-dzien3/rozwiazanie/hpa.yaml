# ToDos · dzień 3: HPA dla api. 2–4 repliki, cel 60% CPU liczone od requests.cpu (50m), czyli ok. 30m na pod.
# Maksimum 4 repliki mieści się w quocie namespace razem z mongo i web (policzone w README rozwiązania).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  labels:
    app.kubernetes.io/part-of: todos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
