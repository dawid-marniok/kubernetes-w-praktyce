# metrics-server dla kind (kubectl top, HPA). Kubelet w kind ma certyfikat self-signed, stąd --kubelet-insecure-tls.
# Tylko na lokalny klaster! Na klastrze szkoleniowym (EKS) instaluje go prowadzący.
# Instalacja:  kubectl apply -k setup/kind/metrics-server
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
patches:
- target: {kind: Deployment, name: metrics-server, namespace: kube-system}
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --kubelet-insecure-tls
