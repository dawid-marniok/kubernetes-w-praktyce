# Lokalny klaster do labów: 1 control plane + 2 workery (Kubernetes 1.35).
# Utworzenie:  kind create cluster --config setup/kind/kind-szkolenie.yaml
# Kontekst:    kind-szkolenie · węzły: szkolenie-control-plane, szkolenie-worker, szkolenie-worker2
# Obraz węzła pasuje do kind v0.33.0 (lista obrazów: https://github.com/kubernetes-sigs/kind/releases).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: szkolenie
nodes:
- role: control-plane
  image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  # Porty z laptopa do klastra: kontroler Ingress/Gateway (80/443) i trzy NodePorty do labów
  extraPortMappings:
  - {containerPort: 80, hostPort: 8088, protocol: TCP}
  - {containerPort: 443, hostPort: 8443, protocol: TCP}
  - {containerPort: 30000, hostPort: 30000, protocol: TCP}
  - {containerPort: 30001, hostPort: 30001, protocol: TCP}
  - {containerPort: 30002, hostPort: 30002, protocol: TCP}
- role: worker
  image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
- role: worker
  image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
